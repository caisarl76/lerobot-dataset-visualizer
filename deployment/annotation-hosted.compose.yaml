# Run on H100; Qwen remains the existing GPU0 service on loopback port 34002.
services:
  annotation:
    build:
      context: ..
      dockerfile: deployment/annotation-backend.Dockerfile
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    environment:
      ANNOTATION_BACKEND_TOKEN: ${ANNOTATION_BACKEND_TOKEN:?Set the private backend credential}
      ANNOTATION_HUB_REPOS: ${ANNOTATION_HUB_REPOS:?Set authorized publication repositories}
      HF_TOKEN: ${HF_TOKEN:?Set a scoped Hub write credential}
      LEROBOT_VLM_API_KEY: ${LEROBOT_VLM_API_KEY:-EMPTY}
      LEROBOT_ANNOTATE_CONFIG: /app/deployment/annotation-hosted.json
      LEROBOT_ANNOTATE_EXPORT: /workspace/annotations
      LEROBOT_ANNOTATE_CACHE: /workspace/cache
      LEROBOT_ANNOTATE_BROWSER_ORIGIN: ${ANNOTATION_BROWSER_ORIGIN:?Set the exact Space origin}
    volumes:
      - ${ANNOTATION_WORKSPACE:?Set an existing writable persistent directory}:/workspace
    command:
      ["uvicorn", "backend.app:app", "--host", "127.0.0.1", "--port", "7861"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:7861/api/health',headers={'Authorization':'Bearer '+os.environ['ANNOTATION_BACKEND_TOKEN']}),timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  gateway:
    image: caddy:2.10.2-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      ANNOTATION_HOSTNAME: ${ANNOTATION_HOSTNAME:?Set a publicly resolvable HTTPS hostname}
    volumes:
      - ./annotation-hosted.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
